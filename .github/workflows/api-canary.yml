# API canary.
# Every Monday, fetches one recent Paige match from the real deadlock-api and runs it through the
# pipeline of the app (schema, tracked player, pruning, envelope, zstd codec, facts, analysis,
# damage, items, scoreboard), then checks the hero and item catalogues against it, and the two
# answers of the community data the review of the last matches relies on (the item purchases of a
# rank by minute and the deaths of the performance curve). If deadlock-api changes its payload, this
# workflow turns red before the users of the app notice.
# It is separate from the CI workflow on purpose: it depends on a third-party service, so its
# failures must never block a push or a pull request. It makes at most ten requests per run, keeps
# nothing and prints no payload (see src/test/canary/match-metadata.canary.ts).
# Third-party actions are pinned by commit SHA (supply-chain hardening); Renovate
# keeps the SHAs up to date.
name: API canary

on:
  schedule:
    # Mondays at 07:00 UTC, an hour after the CI run and after Renovate's weekly run.
    - cron: '0 7 * * 1'
  # Lets the owner run the canary by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Two runs never overlap: a manual run started during the weekly one waits for it instead of
# doubling the requests sent to the API.
concurrency:
  group: api-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes anything: do not leave the token in .git/config.
          persist-credentials: false
      # pnpm version comes from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm canary
