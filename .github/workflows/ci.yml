# Continuous integration.
# Every push to main and every pull request must pass the same checks as `pnpm check`, the
# production build (which must contain no development-only code), the Rust shell checks and the
# dependency audits. The same checks also run every Monday, so that a vulnerability published
# for an unchanged dependency is reported even when nobody pushes.
# Third-party actions are pinned by commit SHA (supply-chain hardening); Renovate
# keeps the SHAs up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 06:00 UTC, after Renovate's weekly run.
    - cron: '0 6 * * 1'
  # Lets the owner run the checks by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push cancels the outdated run of a pull request; every commit of main keeps its result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes anything: do not leave the token in .git/config.
          persist-credentials: false
      # pnpm version comes from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The steps of `pnpm check`, one by one so that a failure names its stage: keep them in sync
      # with the `check` script of package.json.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # Fails if the production build contains development-only code (see scripts/check-dev-code.ts).
      - run: pnpm check:dev-code
      - run: pnpm audit --audit-level high

  tauri:
    name: Tauri shell (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tauri::generate_context!()` embeds `dist/`, so the frontend must be built first.
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      # The Rust unit tests of the shell (e.g. the navigation guard).
      - run: cargo test
        working-directory: src-tauri
      # src-tauri/.cargo/audit.toml ignores RUSTSEC-2023-0071 because the `rsa` crate is listed in
      # Cargo.lock but never compiled. Prove it: this step fails as soon as it is compiled, and also
      # when cargo cannot tell (a check that cannot run proves nothing).
      - name: Check that the rsa crate is not compiled
        shell: bash
        working-directory: src-tauri
        run: |
          if ! tree=$(cargo tree --locked --invert rsa --edges normal,build --target all 2>&1); then
            case "$tree" in
              # rsa left Cargo.lock: nothing can compile it (the audit exception can go too).
              *"did not match any packages"*) exit 0 ;;
            esac
            echo "$tree"
            echo "cargo tree failed: cannot prove that the rsa crate is not compiled"
            exit 1
          fi
          if grep -q '^rsa v' <<< "$tree"; then
            echo "$tree"
            echo "The rsa crate is now compiled: review RUSTSEC-2023-0071 and src-tauri/.cargo/audit.toml"
            exit 1
          fi
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri
