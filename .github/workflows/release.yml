# Release.
# A tag vX.Y.Z pushed by the owner (after `pnpm release:prepare X.Y.Z`) builds the Windows installer
# of that version and creates a DRAFT GitHub release with it. Nothing reaches the players until the
# owner has tried the installer and published the draft (never as a pre-release: the installed apps
# only look at the latest full release).
#
# What the draft holds:
# - the NSIS installer and its signature (`.sig`), made by the Tauri build with the updater's private
#   key, which only exists in the secrets of this repository;
# - `latest.json`, the update file the installed apps download at startup (version, summaries in
#   English and French, signature and download address of the installer);
# - THIRD_PARTY_NOTICES.md, the licences of the software the app includes.
#
# Two jobs, so that no job holds both the signing key and a token that can write to the repository:
# - `build` runs every check of CI again (a tag pushed without a CI run is still covered), then the
#   build with the signing key, with a read-only token and no cache (a cache written by another
#   run could poison the release);
# - `publish` runs no code of the project or its dependencies: it downloads the files of `build`
#   and creates the draft with the write token.
# Third-party actions are pinned by commit SHA, with the same pins as ci.yml; Renovate keeps the SHAs
# up to date. No third-party release action is used: the Tauri CLI and the GitHub CLI do it all.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  # Never two builds of the same tag at once; a new push of the tag waits for the running one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes anything: do not leave the token in .git/config.
          persist-credentials: false
          # The whole history, to check below that the tag is on main.
          fetch-depth: 0

      # Fail fast, before an hour of build: the tag must name the version of the files (e.g. not
      # a tag pushed without `pnpm release:prepare`) and point at a commit of main. The asset
      # script checks the version again at the end, against all four version files.
      - name: Check the tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match the version ${version} of package.json"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not point at a commit of main"
            exit 1
          fi

      # pnpm version comes from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No `cache:` on purpose (see the header).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile

      # The checks of `pnpm check` and of the Tauri shell, as in ci.yml.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # `tauri::generate_context!()` embeds `dist/`, so the frontend must be built before cargo.
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

      # The installer, signed for the updater (the signature also records the version, which the
      # app requires: `requireSignedVersion`). `beforeBuildCommand` (tauri.conf.json) builds the
      # frontend again and proves it holds no development-only code. The secrets reach this step
      # only.
      - name: Build the installer
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Write latest.json and the release description
        shell: bash
        run: |
          node scripts/release/build-release-assets.ts \
            --tag "${GITHUB_REF_NAME}" \
            --bundle src-tauri/target/release/bundle/nsis \
            --out release-assets
          cp src-tauri/target/release/bundle/nsis/*_x64-setup.exe \
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig \
            THIRD_PARTY_NOTICES.md \
            release-assets/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creating the draft release and uploading its files.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "TheLibrary ${GITHUB_REF_NAME#v}" \
            --notes-file release-body.md \
            ./*_x64-setup.exe \
            ./*_x64-setup.exe.sig \
            latest.json \
            THIRD_PARTY_NOTICES.md
